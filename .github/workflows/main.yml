name: guezelwebdesign Quality

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Frontend quality gate
        working-directory: frontend
        # API adresi olmadan taban `/api/v1` (goreli) kalir; build "Collecting page
        # data" asamasinda generateStaticParams fetch'lerinde sonsuza kadar bekliyor
        # ve is 25 dk'da iptal oluyordu (2026-08-20'den beri). Canli build'ler de
        # API adresiyle alinir; bu deger gizli degil, sitenin acik API'si.
        env:
          NEXT_PUBLIC_API_URL: https://www.guezelwebdesign.com/api/v1
        run: |
          bun install --frozen-lockfile || bun install
          bun run lint
          bun run typecheck
          bun run build

      - name: Admin panel quality gate
        working-directory: admin_panel
        run: |
          bun install --frozen-lockfile || bun install
          bun run check
          bun x tsc --noEmit
          bun run build

      - name: Backend quality gate
        working-directory: backend
        run: |
          bun install --frozen-lockfile || bun install
          bun x tsc --noEmit
          bun run check
          bun run build

  # DEPLOY BURADA YOK (2026-10-01). Eski `deploy` isi sunucuda
  # `rm -rf .next && bun run build` yapiyordu: 1 vCPU sunucuda build boyunca site
  # kapali, tum canli siteler yavas. Sunucuda derleme yasak
  # (/etc/vps-guezel-derleme-yasak, scripts/derleme-kilidi.mjs).
  # Yayin yalniz yerelden: bash scripts/deploy-yerel.sh
