name: Admin Panel Deploy

# HEDEF SUNUCU: secrets.VPS_HOST = 72.61.23.36 (orhan@).
# 2026-08-09'a kadar secret 72.61.93.212'yi gosteriyordu; o adres artik bize ait
# DEGIL (Traefik varsayilan sertifikasi donen yabanci bir makine) ve deploy
# adimi 'Permission denied (publickey)' ile kaliyordu. Anahtar sorunu yoktu.

on:
  workflow_dispatch:

jobs:
  deploy-admin:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build and check admin panel
        working-directory: admin_panel
        run: |
          bun install --frozen-lockfile || bun install
          bun run check
          bun x tsc --noEmit
          bun run build

      - name: Setup SSH key
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_KEY: ${{ secrets.VPS_KEY }}
        run: |
          test -n "$VPS_HOST"
          test -n "$VPS_KEY"
          mkdir -p ~/.ssh
          echo "$VPS_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 10 -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      # IKI DAGITIM AGACI
      # gzlteknoloji.com, guezelwebdesign kod tabaninin AYRI BIR KOPYASINDAN
      # sunuluyor (/var/www/vps-guezel/gzlteknoloji-site). Yalnizca guezelwebdesign
      # agacina kopyalamak GZL panelini eski build'de birakir.
      - name: Deploy admin panel (both deployments)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          test -n "$VPS_USER"
          for TREE in guezelwebdesign gzlteknoloji-site; do
            rsync -avz --delete \
              --exclude=node_modules --exclude=.git --exclude=.env --exclude=.env.* --exclude=.DS_Store \
              -e "ssh -o ConnectTimeout=30 -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key" \
              admin_panel/ "${VPS_USER}@${VPS_HOST}:/var/www/vps-guezel/${TREE}/admin_panel"
          done

      - name: Reload and smoke test both admin panels
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -o ConnectTimeout=30 -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key \
            "${VPS_USER}@${VPS_HOST}" <<'REMOTE'
          set -e
          # Sunucudaki sistem Node'u 20 (EOL) ve Next 16 derlemesini kiriyor;
          # Node 22 yan yana kurulu, PATH'e alinmali.
          export PATH=/home/orhan/.local/node22/bin:$PATH
          pm2 restart guezelwebdesign-admin-panel gzlteknoloji-admin-panel --update-env
          pm2 save
          sleep 10
          curl -fsSL http://127.0.0.1:3045/auth/login | grep -E 'name="email"|type="email"' >/dev/null
          curl -fsSL http://127.0.0.1:3121/auth/login | grep -E 'name="email"|type="email"' >/dev/null
          REMOTE

      - name: Verify public admin
        run: |
          curl -fsSL https://panel.guezelwebdesign.com/auth/login | grep -E 'name="email"|type="email"' >/dev/null
          curl -fsSL https://panel.gzlteknoloji.com/auth/login | grep -E 'name="email"|type="email"' >/dev/null
